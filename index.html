<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="src/assets/logo/logo_original.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ebe7f7" />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Glow Up Connect</title>
    <script>
      (function () {
        var THEME_KEY = 'guc_theme';
        var VERSION_KEY = 'guc_theme_version';
        var VERSION = '4';
        var DEFAULT = 'light';
        try {
          if (localStorage.getItem(VERSION_KEY) !== VERSION) {
            localStorage.setItem(THEME_KEY, DEFAULT);
            localStorage.setItem(VERSION_KEY, VERSION);
          }
          var theme = localStorage.getItem(THEME_KEY);
          if (theme !== 'light' && theme !== 'dark') theme = DEFAULT;
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0a0806' : '#ebe7f7');
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <script type="module" src="/src/boot/theme.ts"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
